version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TMDB_API_KEY=${TMDB_API_KEY}
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY}
      - VITE_BACKEND_URL=${VITE_BACKEND_URL}
    restart: unless-stopped
    volumes:
      # Optional: mount for persistent storage or logs
      - ./logs:/app/logs
    networks:
      - movie-player-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL}
    ports:
      - "8118:8118"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - movie-player-network

networks:
  movie-player-network:
    driver: bridge
